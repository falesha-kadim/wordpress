<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordPress Projects</title>
    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fa;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 40px 20px;
    }

    .container {
        width: 100%;
        max-width: 500px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
        padding: 35px;
    }

    h1 {
        text-align: center;
        margin-bottom: 8px;
        font-size: 2rem;
    }

    p {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
    }

    ul {
        list-style: none;
    }

    li+li {
        margin-top: 12px;
    }

    a {
        display: block;
        text-decoration: none;
        color: #333;
        background: #f8f9fb;
        padding: 14px 18px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        transition: all .2s ease;
        font-weight: 600;
    }

    a:hover {
        background: #2563eb;
        color: #fff;
        transform: translateX(5px);
    }
    </style>
</head>

<body>
    <div class="container">
        <h1>WordPress Projects</h1>
        <p>A collection of responsive websites built with WordPress and Bootstrap.</p>
        <ul>
            <li><a href="quit_smoking.jpg" target="_blank">🚭 Quit Smoking Landing Page</a></li>
            <li><a href="aeronet.jpg" target="_blank">🌐 AeroNet Landing Page</a></li>
            <li><a href="amanda_stories.jpg" target="_blank">❤️ Amanda Stories Landing Page</a></li>
            <li><a href="sprint.jpg" target="_blank">⚡ Sprint Landing Page</a></li>
            <li><a href="apr.jpg" target="_blank">📍 APR Landing Page</a></li>
        </ul>
    </div>
</body>

</html>
